spring.application.name=aethis

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true

aethis.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
aethis.jwt.ttl=PT12H
aethis.service-token=${AGENT_SERVICE_TOKEN:dev-service-token}
aethis.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://aethis-liart.vercel.app}

aethis.razorpay.key-id=${RAZORPAY_KEY_ID}
aethis.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
aethis.razorpay.force-failure=${RAZORPAY_FORCE_FAILURE:false}

springdoc.swagger-ui.path=/docs

aethis.demo-tools=${DEMO_TOOLS:true}