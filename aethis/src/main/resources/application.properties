spring.application.name=aethis

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/aethis}
spring.datasource.username=${DB_USER:aethis}
spring.datasource.password=${DB_PASSWORD:aethis}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true

aethis.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
aethis.jwt.ttl=PT12H
aethis.service-token=${AGENT_SERVICE_TOKEN:dev-service-token}
aethis.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

aethis.razorpay.key-id=${RAZORPAY_KEY_ID:}
aethis.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
aethis.razorpay.force-failure=${RAZORPAY_FORCE_FAILURE:false}

springdoc.swagger-ui.path=/docs
